# Cloudflare Pages Configuration
# Uses @opennextjs/cloudflare adapter for Next.js on Cloudflare Pages
# See: https://opennext.js.org/cloudflare

name = 'challenger1'
compatibility_date = '2024-09-23'
compatibility_flags = ["nodejs_compat"]

# OpenNext output directory - must include worker and all dependencies
pages_build_output_dir = '.open-next'

# The _worker.js at the root of .open-next/ is the Cloudflare Pages
# Worker entry point. Static assets (_next/, wasm/, etc.) are also
# served from this directory by the Pages CDN.
