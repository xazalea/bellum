# Cloudflare Workers Configuration
# Uses @opennextjs/cloudflare adapter for Next.js on Cloudflare Workers
# See: https://opennext.js.org/cloudflare

name = "challengerdeep"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_als"]

# OpenNext adapter output
main = ".open-next/worker.js"

# Static assets served by Workers Sites
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# NOTE: For Git-based deployments, configure build settings in Cloudflare Dashboard:
# Settings → Builds & deployments → Build configurations
# - Build command: pnpm run build:cloudflare
# - Build output directory: .open-next/assets

[env.production]
compatibility_flags = ["nodejs_compat", "nodejs_als"]
