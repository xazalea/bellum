# Cloudflare Pages Configuration
# Uses @opennextjs/cloudflare adapter for Next.js on Cloudflare Pages
# See: https://opennext.js.org/cloudflare

name = 'challengerdeep'
compatibility_date = '2024-09-23'

# OpenNext output directory for static assets
pages_build_output_dir = '.open-next/assets'

# NOTE: The worker (.open-next/worker.js) must be deployed separately
# as a Cloudflare Worker. See wrangler.workers.toml for worker config.