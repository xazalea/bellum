# Cloudflare Pages Configuration
# This file is used for Pages deployment (not Workers)
# Pages projects use .pages.dev domains, not .workers.dev

name = "challengerdeep"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages-specific configuration
pages_build_output_dir = ".vercel/output/static"

# NOTE: For Git-based deployments, configure build settings in Cloudflare Dashboard:
# Settings → Builds & deployments → Build configurations
# - Build command: pnpm run build:cloudflare
# - Build output directory: .vercel/output/static

[env.production]
compatibility_flags = ["nodejs_compat"]
